# Agency schedule: run the MSRC ICM report every 2 days in the cloud.
#
# Requires the repository to be enrolled in the Agency schedules private preview
# (see README.md). The Agency service dispatches this job on the cron cadence —
# nothing runs on your laptop and your machine does NOT need to be on.
#
# NOTE: cron day-of-month "*/2" fires on odd days of the month (1,3,5,...,31),
# which is "every 2 days" within a month. Adjust the hour/timezone as needed.

# metadata
name: MSRC ICM report schedule
description: Emails the active MSRC ICM report every 2 days.

# filters
resource: repository

# primitive configuration
configuration:
  agencySchedules:
    - name: "msrc-icm-report-every-2-days"
      schedule:
        cron: "0 6 */2 * *"          # 06:00 every 2nd day-of-month
        timezone: "America/Los_Angeles"
      job:
        agent:
          name: "msrc-icm-report"    # matches .github/agents/msrc-icm-report.agent.md
          type: Repo
